<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="EVIL — حساباتي وموسيقاي في مكان واحد.">
  <title>EVIL — Official</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #070707;
      color: #f5f5f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #929292;
      --panel: rgba(18, 18, 18, .86);
      --line: rgba(255, 255, 255, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: #070707;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: -8%;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .28), rgba(0, 0, 0, .52) 58%, #070707 100%),
        radial-gradient(ellipse at 50% 45%, transparent 0, rgba(0, 0, 0, .38) 78%),
        url("cls63-background.png");
      background-position: center, center, center 54%;
      background-size: cover;
      background-repeat: no-repeat;
      content: "";
      animation: drift 7s ease-in-out infinite;
      filter: saturate(.82);
      pointer-events: none;
    }

    body::after {
      position: fixed;
      z-index: 0;
      inset: 0;
      background:
        radial-gradient(ellipse 32rem 7rem at 12% 72%, rgba(220, 220, 220, .10), transparent 72%),
        radial-gradient(ellipse 28rem 7rem at 84% 58%, rgba(185, 185, 185, .08), transparent 72%);
      content: "";
      animation: smoke 12s ease-in-out infinite alternate;
      filter: blur(26px);
      pointer-events: none;
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(-3%, 0, 0) scale(1.12) rotate(-.35deg); }
      50% { transform: translate3d(3%, -1%, 0) scale(1.16) rotate(.35deg); }
    }

    @keyframes smoke {
      from { opacity: .35; transform: translate3d(-2%, 2%, 0); }
      to { opacity: .85; transform: translate3d(2%, -1%, 0); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 600px);
      margin: 0 auto;
      padding: 46px 0 30px;
    }

    .profile {
      display: grid;
      justify-items: center;
      text-align: center;
      animation: appear .7s ease both;
    }

    .avatar {
      display: grid;
      width: 104px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 25%, #444, transparent 38%),
        linear-gradient(145deg, #191919, #050505 70%);
      box-shadow: 0 0 45px rgba(255, 255, 255, .09), inset 0 0 20px #000;
      color: #fff;
      font-size: 34px;
      font-weight: 850;
      letter-spacing: -.08em;
      text-indent: -.08em;
      overflow: hidden;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
    }

    h1 {
      margin: 16px 0 3px;
      font-size: 27px;
      font-weight: 750;
      letter-spacing: .14em;
      direction: ltr;
    }

    .verified {
      display: inline-grid;
      width: 17px;
      aspect-ratio: 1;
      margin-inline-start: 4px;
      place-items: center;
      border-radius: 50%;
      background: #f4f4f4;
      color: #080808;
      font-size: 11px;
      vertical-align: 3px;
    }

    .bio {
      margin: 6px 0 0;
      color: #a4a4a4;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 27px 0 24px;
      direction: ltr;
    }

    .social {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(150deg, #1d1d1d, #101010);
      color: #f8f8f8;
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .social:hover, .social:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, .38);
      background: #242424;
      outline: none;
    }

    .social svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .spotify-mark { fill: currentColor; stroke: none; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 2px 11px;
      color: #aaa;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .16em;
    }

    .section-label::after {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--line));
      content: "";
    }

    .music-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .35);
      animation: appear .8s .12s ease both;
      backdrop-filter: blur(14px);
    }

    .music-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 17px 12px;
    }

    .track-info { text-align: right; }

    .track-name {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .track-artist {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .playing {
      display: flex;
      height: 23px;
      align-items: center;
      gap: 3px;
      padding-inline: 8px;
      direction: ltr;
    }

    .playing span {
      width: 3px;
      height: 8px;
      border-radius: 3px;
      background: #e7e7e7;
      animation: equalize .85s ease-in-out infinite alternate;
    }

    .playing span:nth-child(2) { height: 16px; animation-delay: .18s; }
    .playing span:nth-child(3) { height: 11px; animation-delay: .33s; }
    .playing span:nth-child(4) { height: 19px; animation-delay: .1s; }

    @keyframes equalize {
      to { transform: scaleY(.35); opacity: .48; }
    }

    .player {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      background: #111;
    }

    .play-note {
      margin: 0;
      padding: 0 16px 14px;
      color: #8d8d8d;
      font-size: 11px;
    }

    footer {
      margin-top: 21px;
      color: #666;
      font-size: 11px;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      main { padding-top: 34px; }
      .avatar { width: 92px; }
      .socials { gap: 9px; }
      .social { width: 43px; height: 43px; border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      body::before {
        animation: drift 7s ease-in-out infinite !important;
      }
    }
  </style>
</head>
